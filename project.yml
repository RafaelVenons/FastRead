name: FastRead

options:
  bundleIdPrefix: com.rafaelg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Inglês é o idioma base; o app segue o idioma do sistema.
  developmentLanguage: en

settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  FastReadCore:
    path: .

targets:
  FastRead:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: FastReadCore
        product: FastReadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafaelg.FastRead
        PRODUCT_NAME: FastRead
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # 2 = iPad. O alvo é o iPad Air 5; a leitura com Pencil não faz sentido no iPhone.
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Reprodução continua com a tela bloqueada, como um audiobook.
        INFOPLIST_KEY_UIBackgroundModes: audio
        # Assinatura automática para instalar no iPad Air 5. O simulador ignora isto.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J5YKV9K4P8

  FastReadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: FastRead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafaelg.FastReadUITests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J5YKV9K4P8
        TEST_TARGET_NAME: FastRead

schemes:
  FastRead:
    build:
      targets:
        FastRead: all
        FastReadUITests: [test]
    test:
      targets:
        - FastReadUITests
    run:
      config: Debug
